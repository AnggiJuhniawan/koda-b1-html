<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catur</title>
    <style>
      * {
        box-sizing: border-box;
      }
      .board {
        width: 1000px;
        height: 1000px;
        border: 4px solid black;
        position: relative;
      }
      .row {
        display: block;
        height: 12.5%;
      }
      .cell {
        display: inline-block;
        width: 12.5%;
        height: 100%;
        vertical-align: top;
        position: relative;
        background-color: blueviolet;
      }

      /* Warna warni */
      .row:nth-child(odd) .cell:nth-child(even),
      .row:nth-child(even) .cell:nth-child(odd) {
        background-color: chartreuse;
      }
      .piece {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      .black {
        color: red;
      }
      .white {
        color: green;
      }
    </style>
  </head>
  <body>
    <h1>Catur</h1>
    <div class="board">
      <!-- baris 1 -->
      <div class="row">
          <div class="cell"><div class="piece black"></div></div>
          <div class="cell"><div class="piece black"></div></div>
          <div class="cell"><div class="piece black"></div></div>
          <div class="cell"><div class="piece black"></div></div>
          <div class="cell"><div class="piece black"></div></div>
          <div class="cell"><div class="piece black"></div></div>
          <div class="cell"><div class="piece black"></div></div>
          <div class="cell"><div class="piece black"></div></div>
        </div>

      <!-- baris 2 -->
      <div class="row">
          <div class="cell"><div class="piece black"></div></div>
          <div class="cell"><div class="piece black"></div></div>
          <div class="cell"><div class="piece black"></div></div>
          <div class="cell"><div class="piece black"></div></div>
          <div class="cell"><div class="piece black"></div></div>
          <div class="cell"><div class="piece black"></div></div>
          <div class="cell"><div class="piece black"></div></div>
          <div class="cell"><div class="piece black"></div></div>
        </div>

      /* baris 3 */
      <div class="row">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>

      <!-- baris 4 -->
      <div class="row">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>

      <!-- baris 5 -->
      <div class="row">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>

      <!-- baris 6 -->
      <div class="row">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>

      <!-- baris 7 -->
      <div class="row">
          <div class="cell"><div class="piece white"></div></div>
          <div class="cell"><div class="piece white"></div></div>
          <div class="cell"><div class="piece white"></div></div>
          <div class="cell"><div class="piece white"></div></div>
          <div class="cell"><div class="piece white"></div></div>
          <div class="cell"><div class="piece white"></div></div>
          <div class="cell"><div class="piece white"></div></div>
          <div class="cell"><div class="piece white"></div></div>
        </div>

        <!-- baris 8 -->
        <div class="row">
          <div class="cell"><div class="piece white"></div></div>
          <div class="cell"><div class="piece white"></div></div>
          <div class="cell"><div class="piece white"></div></div>
          <div class="cell"><div class="piece white"></div></div>
          <div class="cell"><div class="piece white"></div></div>
          <div class="cell"><div class="piece white"></div></div>
          <div class="cell"><div class="piece white"></div></div>
          <div class="cell"><div class="piece white"></div></div>
        </div>
      </div>
    </div>
  </body>
</html>
