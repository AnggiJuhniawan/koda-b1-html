<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
  </head>
  <style>
    label {
      color: green;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1rem;
    }
    label.big {
      font-size: 20px;
      background-color: red;
      font-weight: bold;
    }
    .red {
      color: aqua;
      letter-spacing: 2px;
    }
  </style>
  <body>
    <h1 class="big">Hasil Survei Perokok</h1>
    <form action="#" method="get">
      <div>
        <label for="name" class="big red">Siapa nama anda</label>
        <input type="text" id="name" name="nama" required="required" />
      </div>
      <div>
        <label for="umur">Berapa umur anda?</label>
        <input type="number" id="umur" name="umur" required="required" />
      </div>
      <div>
        <label for="Jenis">Apa jenis kelamin anda?</label>
        <input type="radio" id="laki" name="jenis_kelamin" value="Laki-laki" />
        <label for="laki">Laki-laki</label>
        <input type="radio" id="perempuan" name="jenis_kelamin" />
        <label for="cewe">Perempuan</label>
      </div>
      <div>
        <label for="">Apakah anda perokok?</label>
        <input type="radio" id="perokok" name="perokok" value="Ya" />
        <label for="perokok">Ya</label>
        <input type="radio" id="tidak" name="perokok" />
        <label for="tidak">Tidak</label>
      </div>
      <div>
        <p>Jika anda perokok, rokok apa yang pernah dicoba?</p>
        <input type="checkbox" id="gg" name="rokok" value="Gudang Garam" />
        <label for="gg">Gudang garam</label>
        <input type="checkbox" id="lucky" name="rokok" value="Lucky Strike" />
        <label for="malboro">Malboro</label>
      </div>
      <button type="submit">OK</button>
    </form>
  </body>
</html>
